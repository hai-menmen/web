<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xem quảng cáo - Nhận 50đ</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 380px;
      background: white;
      padding: 25px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,.1);
    }

    .balance {
      font-size: 28px;
      font-weight: bold;
      margin: 20px 0;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #0088ff;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>📺 Xem quảng cáo</h2>

  <div class="balance">
    Số dư: <span id="balance">0</span>đ
  </div>

  <button id="watchBtn">
    Xem quảng cáo +50đ
  </button>

  <div id="status"></div>
</div>

<!--
  DÁN SCRIPT MONETAG CỦA BẠN VÀO ĐÂY
-->

<script>
const watchBtn = document.getElementById("watchBtn");
const balanceEl = document.getElementById("balance");
const statusEl = document.getElementById("status");

let balance = Number(localStorage.getItem("balance") || 0);

balanceEl.textContent = balance;

watchBtn.addEventListener("click", async () => {

  watchBtn.disabled = true;
  statusEl.textContent = "Đang mở quảng cáo...";

  try {

    /*
      Gọi quảng cáo Monetag tại đây.

      Sau khi Monetag xác nhận lượt quảng cáo hợp lệ,
      backend của bạn mới được phép cộng 50đ.

      Ví dụ:
      const result = await watchMonetagAd();

      if (!result.completed) {
        throw new Error("Chưa hoàn thành quảng cáo");
      }
    */

    statusEl.textContent =
      "Đang chờ hệ thống xác nhận lượt xem...";

    // DEMO ONLY:
    // Không dùng đoạn này khi chạy thật.
    setTimeout(() => {
      statusEl.textContent =
        "Demo: cần backend xác nhận trước khi cộng tiền.";
      watchBtn.disabled = false;
    }, 3000);

  } catch (error) {
    statusEl.textContent = error.message;
    watchBtn.disabled = false;
  }
});
</script>

</body>
</html>
