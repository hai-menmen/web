<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bypass Tool</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  body{
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
    min-height:100vh;
    background:
      radial-gradient(900px 520px at 50% -15%, rgba(35,90,200,.55), transparent 65%),
      radial-gradient(700px 420px at 105% 110%, rgba(0,200,255,.16), transparent 60%),
      #05070f;
    color:#e8eeff;
    display:flex;justify-content:center;
    padding:26px 14px 70px;
  }

  .app{width:100%;max-width:640px;display:flex;flex-direction:column;gap:16px}

  /* ---------- HEADER ---------- */
  header{text-align:center;padding:6px 0 2px}
  .logo{
    width:66px;height:66px;margin:0 auto 12px;border-radius:20px;
    background:linear-gradient(135deg,#00d4ff,#1f6feb);
    display:flex;align-items:center;justify-content:center;font-size:30px;
    box-shadow:0 0 36px rgba(0,180,255,.55);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 26px rgba(0,180,255,.42)}
    50%{box-shadow:0 0 46px rgba(0,200,255,.75)}
  }
  h1{
    font-size:26px;letter-spacing:3px;font-weight:800;
    background:linear-gradient(90deg,#7fd8ff,#ffffff,#7fd8ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{font-size:12.5px;color:#7d8db3;margin-top:7px;letter-spacing:.5px}

  /* ---------- PANEL ---------- */
  .panel{
    background:linear-gradient(180deg,rgba(18,28,58,.86),rgba(10,16,34,.86));
    border:1px solid rgba(120,160,255,.14);
    border-radius:18px;padding:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.45);
  }
  .panel h2{
    font-size:11.5px;text-transform:uppercase;letter-spacing:1.6px;
    color:#6f83ad;margin-bottom:13px;font-weight:700;
    display:flex;align-items:center;gap:8px;
  }
  .panel h2::before{
    content:"";width:3px;height:13px;border-radius:2px;
    background:linear-gradient(180deg,#00d4ff,#1f6feb);
  }

  /* ---------- SITES ---------- */
  .sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
  .chip{
    padding:11px 8px;border-radius:11px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(120,160,255,.18);
    font-size:12.5px;font-weight:600;text-align:center;
    color:#b9c8ea;cursor:pointer;user-select:none;
    transition:all .18s ease;position:relative;overflow:hidden;
  }
  .chip:hover{background:rgba(90,140,255,.14);border-color:rgba(120,170,255,.5);color:#fff}
  .chip.active{
    background:linear-gradient(135deg,#1f6feb,#00d4ff);
    border-color:#00d4ff;color:#03111f;font-weight:800;
    box-shadow:0 0 18px rgba(0,212,255,.45);
    transform:translateY(-1px);
  }
  .chip.active::after{
    content:"✓";position:absolute;top:3px;right:6px;font-size:10px;opacity:.85;
  }
  .hint{font-size:11px;color:#5f7099;margin-top:10px;text-align:center}

  /* ---------- INPUT ---------- */
  .input{
    width:100%;padding:14px 16px;border-radius:12px;
    background:rgba(8,16,38,.9);
    border:1px solid rgba(120,160,255,.25);
    color:#e8eeff;font-size:13.5px;outline:none;
    transition:.2s;font-family:inherit;
  }
  .input::placeholder{color:#556690}
  .input:focus{
    border-color:#00d4ff;
    box-shadow:0 0 0 3px rgba(0,212,255,.14);
    background:rgba(8,20,48,.95);
  }

  .btn{
    width:100%;margin-top:12px;padding:15px;border:none;border-radius:12px;
    background:linear-gradient(135deg,#00d4ff,#1f6feb);
    color:#02101f;font-weight:900;font-size:15.5px;letter-spacing:1px;
    cursor:pointer;transition:.2s;font-family:inherit;
    box-shadow:0 8px 24px rgba(0,140,255,.35);
  }
  .btn:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
  .btn:active:not(:disabled){transform:translateY(0)}
  .btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}

  /* ---------- RESULT ---------- */
  #result{margin-top:14px}

  .loading{padding:6px 2px;text-align:center}
  .bar{
    width:100%;height:8px;border-radius:99px;
    background:rgba(255,255,255,.07);overflow:hidden;margin-bottom:12px;
  }
  .fill{
    height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#00d4ff,#1f6feb,#00d4ff);
    background-size:200% 100%;
    animation:flow 1.2s linear infinite;
  }
  @keyframes flow{from{background-position:0 0}to{background-position:200% 0}}
  .ltext{font-size:13px;color:#8fa4cc;letter-spacing:.4px}
  .ltext b{color:#00d4ff;font-size:16px}

  .err{
    padding:15px 16px;border-radius:12px;
    background:rgba(255,60,80,.09);
    border:1px solid rgba(255,70,90,.42);
    color:#ff5b6e;font-weight:800;font-size:13.5px;
    text-align:center;line-height:1.55;letter-spacing:.3px;
    animation:shake .42s ease;
    text-shadow:0 0 14px rgba(255,60,80,.45);
  }
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-6px)}
    40%{transform:translateX(6px)}
    60%{transform:translateX(-4px)}
    80%{transform:translateX(4px)}
  }

  .ok{
    padding:15px;border-radius:12px;
    background:rgba(0,255,150,.07);
    border:1px solid rgba(0,255,150,.35);
    animation:fadeUp .35s ease;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .ok-title{
    color:#25f5a5;font-weight:900;font-size:13px;letter-spacing:1.2px;
    margin-bottom:10px;text-align:center;
    text-shadow:0 0 14px rgba(0,255,150,.5);
  }
  .ok-link{
    display:block;word-break:break-all;font-size:12.5px;line-height:1.6;
    color:#8ee6ff;text-decoration:none;padding:10px 12px;border-radius:9px;
    background:rgba(0,0,0,.32);border:1px dashed rgba(0,212,255,.35);
  }
  .ok-link:hover{color:#fff;border-color:#00d4ff}
  .copy{
    width:100%;margin-top:10px;padding:11px;border-radius:9px;border:none;
    background:linear-gradient(135deg,#00d4ff,#1f6feb);
    color:#02101f;font-weight:800;font-size:12.5px;letter-spacing:.6px;
    cursor:pointer;font-family:inherit;transition:.2s;
  }
  .copy:hover{filter:brightness(1.12)}

  /* ---------- STATS ---------- */
  .stat-row{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:12.5px;color:#8fa4cc;margin-bottom:9px;
  }
  .stat-row .big{color:#fff;font-weight:800;font-size:14px}
  .stat-row .big b{color:#00d4ff}
  .track{
    width:100%;height:9px;border-radius:99px;
    background:rgba(255,255,255,.07);overflow:hidden;
  }
  .fill2{
    height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#1f6feb,#00d4ff);
    transition:width .6s ease;
    box-shadow:0 0 12px rgba(0,180,255,.6);
  }
  .limit{
    display:none;margin-top:12px;padding:11px 13px;border-radius:10px;
    background:rgba(255,170,0,.08);
    border:1px solid rgba(255,180,40,.4);
    color:#ffc247;font-size:12.5px;font-weight:800;text-align:center;
    letter-spacing:.3px;animation:fadeUp .3s ease;
  }

  footer{text-align:center;font-size:11px;color:#3f4d70;margin-top:6px;letter-spacing:.4px}
</style>
</head>
<body>

<div class="app">

  <header>
    <div class="logo">⚡</div>
    <h1>BYPASS TOOL</h1>
    <p class="sub">Hệ thống vượt link tự động • Version 2.4</p>
  </header>

  <!-- DANH SÁCH TRANG HỖ TRỢ -->
  <section class="panel">
    <h2>Trang hỗ trợ</h2>
    <div class="sites" id="sites"></div>
    <p class="hint">Ấn chọn các link trên để xác nhận</p>
  </section>

  <!-- NHẬP LINK -->
  <section class="panel">
    <h2>Nhập link cần vượt</h2>
    <input class="input" id="url" type="text" spellcheck="false"
           placeholder="Dán URL của web cần vượt link (https://...)">
    <button class="btn" id="go">VƯỢT LINK</button>
    <div id="result"></div>
  </section>

  <!-- THỐNG KÊ -->
  <section class="panel">
    <h2>Thống kê hôm nay</h2>
    <div class="stat-row">
      <span>Lượt vượt hôm nay</span>
      <span class="big"><b id="cnt">0</b> / 2.000</span>
    </div>
    <div class="track"><div class="fill2" id="bar2"></div></div>
    <div class="limit" id="limit">⚠ Đã đạt đến giới hạn lượt vượt hôm nay 2000</div>
  </section>

  <footer>© Bypass Tool — Auto System</footer>
</div>

<script>
/* =========================================================
   CẤU HÌNH
   ========================================================= */
const CONFIG = {
  WAIT_SECONDS: 15,          // thời gian chờ
  RATE_CONN_ERROR: 85,       // % lỗi kết nối
  RATE_ERROR_404: 15,        // % lỗi 404
  KNOWN_LINKS_WORK: true     // link đã biết -> trả kết quả
};

/* =========================================================
   THÔNG TIN ẨN — KHÔNG HIỂN THỊ LÊN GIAO DIỆN
   ========================================================= */
const HIDDEN_LINKS = {
  "https://layma.net/5ABkvpfQu":
    "https://www.mediafire.com/file/msusgfxw3xosdpl/AimLock+Bro.zip/file",

  "https://link4m.net/eYerc":
    "https://www.mediafire.com/file/yqefvmq4mefu7h5/Minecraft_PE_26.30_BANDISHARE.apk/file",

  "https://bbmkts.com/go/Hfz47hy5":
    "https://www.mediafire.com/file/i5eioodkjudzmty/hackff+menuFFM.zip/file",

  "https://gtraffic.io/Yv2QaKD":
    "https://pastefy.app/bbSrxKOk/raw"
};

/* =========================================================
   DANH SÁCH TRANG HỖ TRỢ
   ========================================================= */
const SITES = [
  "Gtraffic.io",
  "Link4m",
  "Layma.net",
  "Traffic4k.com",
  "Site2s.com",
  "Bbmkt.com",
  "system.traffichub.vn",
  "app.trafficviet.vn",
  "Phienchoso.com"
];

/* =========================================================
   KHUNG GIỜ / LƯỢT DÙNG
   ========================================================= */
const HOUR_RANGES = [
  [50, 100],    // 0h
  [100, 120],   // 1h
  [125, 145],   // 2h
  [145, 170],   // 3h
  [170, 210],   // 4h
  [210, 250],   // 5h
  [260, 400],   // 6h
  [400, 460],   // 7h
  [460, 530],   // 8h
  [530, 600],   // 9h
  [600, 900],   // 10h
  [900, 1100],  // 11h
  [1100, 1250], // 12h
  [1250, 1400], // 13h
  [1400, 1450], // 14h
  [1450, 1520], // 15h
  [1520, 1560], // 16h
  [1560, 1600], // 17h
  [1600, 1666], // 18h
  [1666, 1700], // 19h
  [1700, 1800], // 20h
  [1800, 1850], // 21h
  [1850, 1900], // 22h
  [1900, 2000]  // 23h
];

const DAILY_LIMIT = 2000;
const randInt = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const $ = id => document.getElementById(id);

/* =========================================================
   RENDER DANH SÁCH TRANG
   ========================================================= */
(function renderSites() {
  const box = $("sites");
  SITES.forEach(name => {
    const el = document.createElement("div");
    el.className = "chip";
    el.textContent = name;
    el.addEventListener("click", () => el.classList.toggle("active"));
    box.appendChild(el);
  });
})();

/* =========================================================
   LOGIC VƯỢT LINK
   ========================================================= */
let busy = false;

$("go").addEventListener("click", () => {
  if (busy) return;

  const resultBox = $("result");
  const raw = $("url").value.trim();

  resultBox.innerHTML = "";

  /* --- kiểm tra rỗng --- */
  if (!raw) {
    showError("Vui lòng dán URL của web cần vượt link.");
    return;
  }

  /* --- chỉ chấp nhận https:// --- */
  if (!/^https:\/\//i.test(raw)) {
    showError("Link không hợp lệ! Chỉ chấp nhận dạng https://");
    return;
  }

  const url = raw.replace(/\/+$/, ""); // bỏ dấu / cuối
  busy = true;
  $("go").disabled = true;

  /* --- hiển thị tiến trình 15 giây --- */
  resultBox.innerHTML = `
    <div class="loading">
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="ltext">Đang vượt link... <b id="cd">${CONFIG.WAIT_SECONDS}</b>s</div>
    </div>`;

  const fill = $("fill");
  requestAnimationFrame(() => {
    fill.style.transition = `width ${CONFIG.WAIT_SECONDS}s linear`;
    requestAnimationFrame(() => { fill.style.width = "100%"; });
  });

  let t = CONFIG.WAIT_SECONDS;
  const timer = setInterval(() => {
    t--;
    const cd = $("cd");
    if (cd) cd.textContent = t;
    if (t <= 0) {
      clearInterval(timer);
      finish(url);
    }
  }, 1000);
});

/* ---------- KẾT QUẢ SAU 15 GIÂY ---------- */
function finish(url) {
  busy = false;
  $("go").disabled = false;

  const box = $("result");

  /* 1. Link nằm trong danh sách ẩn -> trả kết quả */
  if (CONFIG.KNOWN_LINKS_WORK && HIDDEN_LINKS[url]) {
    const out = HIDDEN_LINKS[url];
    box.innerHTML = `
      <div class="ok">
        <div class="ok-title">✓ VƯỢT LINK THÀNH CÔNG</div>
        <a class="ok-link" href="${out}" target="_blank" rel="noopener">${out}</a>
        <button class="copy" id="copyBtn">SAO CHÉP LINK</button>
      </div>`;

    $("copyBtn").addEventListener("click", () => {
      navigator.clipboard.writeText(out).then(() => {
        const b = $("copyBtn");
        b.textContent = "ĐÃ SAO CHÉP ✓";
        setTimeout(() => { b.textContent = "SAO CHÉP LINK"; }, 1500);
      }).catch(() => {
        const b = $("copyBtn");
        b.textContent = "KHÔNG THỂ SAO CHÉP";
        setTimeout(() => { b.textContent = "SAO CHÉP LINK"; }, 1500);
      });
    });
    return;
  }

  /* 2. Random lỗi 85% / 15% */
  const roll = Math.random() * 100;

  if (roll < CONFIG.RATE_CONN_ERROR) {
    box.innerHTML =
      `<div class="err">✖ Lỗi kết nối thiết bị, vui lòng kiểm tra kết nối mạng của bạn</div>`;
  } else {
    box.innerHTML =
      `<div class="err">✖ ERROR 404 — Do not accept this action</div>`;
  }
}

/* ---------- LỖI NHẬP LIỆU ---------- */
function showError(msg) {
  $("result").innerHTML = `<div class="err">✖ ${msg}</div>`;
}

/* =========================================================
   HỆ THỐNG ĐẾM LƯỢT (NGẪU NHIÊN THEO KHUNG GIỜ)
   ========================================================= */
const state = { hour: -1, target: 0, count: 0 };

function setHour(h) {
  state.hour = h;
  const [mn, mx] = HOUR_RANGES[h];
  let t = randInt(mn, mx);
  if (t < state.count) t = state.count; // không giảm
  state.target = t;
  renderStats();
}

function renderStats() {
  const c = state.count;
  $("cnt").textContent = c.toLocaleString("en-US");
  $("bar2").style.width = Math.min(100, (c / DAILY_LIMIT) * 100) + "%";
  $("limit").style.display = (c >= DAILY_LIMIT) ? "block" : "none";
}

function tick() {
  if (state.count < state.target) {
    state.count = Math.min(state.count + randInt(5, 20), state.target);
    renderStats();
  }
  scheduleTick();
}

function scheduleTick() {
  // cứ 1 -> 5 phút cộng thêm 5 -> 20 lượt
  setTimeout(tick, randInt(1, 5) * 60 * 1000);
}

function checkHour() {
  const h = new Date().getHours();
  if (h !== state.hour) {
    if (h === 0) state.count = randInt(0, 50); // reset 00:00
    setHour(h);
  }
}

(function initCounter() {
  const h = new Date().getHours();
  if (h === 0) {
    state.count = randInt(0, 50);
  } else {
    const [mn, mx] = HOUR_RANGES[h - 1];
    state.count = randInt(mn, mx);
  }
  setHour(h);
  scheduleTick();
  setInterval(checkHour, 20000);
})();
</script>
</body>
  </html>
